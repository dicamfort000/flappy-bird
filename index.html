<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Mobile Version</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #4ec0ca; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        canvas { 
            display: block; 
            background: lightblue; 
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            touch-action: none; /* Важливо для мобільних: прибирає затримку та гортання сторінки */
        }
        #ui {
            position: absolute;
            top: 10px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            color: white;
            text-shadow: 2px 2px #000;
            z-index: 10;
        }
        #mainBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 24px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 20;
            pointer-events: auto;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Рахунок: <span id="score">0</span> | Рекорд: <span id="best">0</span></h2>
    </div>

    <button id="mainBtn">ГРАТИ</button>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainBtn = document.getElementById('mainBtn');
        const scoreDisplay = document.getElementById('score');
        const bestDisplay = document.getElementById('best');

        // --- АДАПТИВНІСТЬ ---
        function resizeCanvas() {
            // Гра буде займати всю ширину екрана, але не більше 450px (для ПК)
            let width = window.innerWidth;
            let height = window.innerHeight;
            
            if (width > 450) width = 400; // Обмеження для великих екранів
            
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let assetsLoaded = { bird: false, bg: false, pipe: false };
        const birdImg = new Image(); birdImg.src = "assets/bird.png"; birdImg.onload = () => assetsLoaded.bird = true;
        const bgImg = new Image(); bgImg.src = "assets/bg.png"; bgImg.onload = () => assetsLoaded.bg = true;
        const pipeImg = new Image(); pipeImg.src = "assets/pipe.png"; pipeImg.onload = () => assetsLoaded.pipe = true;

        // ПАРАМЕТРИ ПТАШКИ (64x46 - як ти просив)
        let bird = { x: 50, y: 250, w: 64, h: 46, gravity: 0.25, velocity: 0, jump: -5.5 };
        let pipes = [];
        let score = 0;
        let isGameRunning = false;
        let frame = 0;

        let highScore = localStorage.getItem('flappyBest') || 0;
        bestDisplay.innerText = highScore;

        function createPipe() {
            const gap = 160; // Трохи більше місця для великої пташки
            const minH = 50;
            const maxH = canvas.height - gap - 100;
            const h = Math.floor(Math.random() * (maxH - minH)) + minH;
            pipes.push({ x: canvas.width, y: h, gap: gap, passed: false });
        }

        function resetGame() {
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frame = 0;
            scoreDisplay.innerText = score;
            isGameRunning = true;
            mainBtn.classList.add('hidden');
            gameLoop();
        }

        function gameOver() {
            isGameRunning = false;
            mainBtn.innerText = "ЩЕ РАЗ?";
            mainBtn.classList.remove('hidden');
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyBest', highScore);
                bestDisplay.innerText = highScore;
            }
        }

        function gameLoop() {
            if (!isGameRunning) return;

            // Гравітація
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Фон
            if (assetsLoaded.bg) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = "#4ec0ca"; ctx.fillRect(0, 0, canvas.width, canvas.height); }

            // Труби
            if (frame % 90 === 0) createPipe();

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= 3;

                // Малюємо труби
                if (assetsLoaded.pipe) {
                    // Верхня
                    ctx.save();
                    ctx.translate(p.x + 50, p.y);
                    ctx.rotate(Math.PI);
                    ctx.drawImage(pipeImg, 0, 0, 50, canvas.height);
                    ctx.restore();
                    // Нижня
                    ctx.drawImage(pipeImg, p.x, p.y + p.gap, 50, canvas.height);
                } else {
                    ctx.fillStyle = "green";
                    ctx.fillRect(p.x, 0, 50, p.y);
                    ctx.fillRect(p.x, p.y + p.gap, 50, canvas.height);
                }

                // Колізії
                if (bird.x + bird.w - 10 > p.x && bird.x + 10 < p.x + 50) {
                    if (bird.y + 10 < p.y || bird.y + bird.h - 10 > p.y + p.gap) gameOver();
                }

                if (!p.passed && p.x + 50 < bird.x) {
                    score++;
                    p.passed = true;
                    scoreDisplay.innerText = score;
                }

                if (p.x < -60) pipes.splice(i, 1);
            }

            // Пташка
            if (assetsLoaded.bird) ctx.drawImage(birdImg, bird.x, bird.y, bird.w, bird.h);
            else { ctx.fillStyle = "yellow"; ctx.fillRect(bird.x, bird.y, bird.w, bird.h); }

            // Межі екрана
            if (bird.y + bird.h > canvas.height || bird.y < 0) gameOver();

            frame++;
            requestAnimationFrame(gameLoop);
        }

        const jump = () => { if(isGameRunning) bird.velocity = bird.jump; };

        // КЕРУВАННЯ (Комп'ютер + Телефон)
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });
        canvas.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            if(!isGameRunning && !mainBtn.classList.contains('hidden')) return; // Щоб не стрибати кнопкою
            jump(); 
        }, {passive: false});
        
        mainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
        });
    </script>
</body>
</html>
